<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ترازبُرد (TarazBoard OS) — سامانه هوش خرده‌فروشی و پایش شعب | ساخته‌شده در Binesh</title>
  <meta name="description" content="دموی تعاملی سامانه هوش تجاری ترازبُرد برای پایش فروش، مشتریان، کالاها و نقشه ۳۱ استان زنجیره فروشگاهی — طراحی‌شده توسط Binesh." />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style id="binesh-core-styles">

:root,
[data-theme="dark"] {
  --bg-main: #090A0E;
  --bg-card: #111319;
  --bg-elevated: #171A22;
  --bg-subtle: #14171F;
  --bg-hover: #1B1F2A;
  --bg-accent-soft: rgba(245, 158, 11, 0.12);
  --bg-accent-muted: rgba(245, 158, 11, 0.06);
  --c-primary: #F59E0B;
  --c-primary-hover: #FBBF24;
  --c-primary-deep: #D97706;
  --c-secondary: #10B981;
  --c-tertiary: #FB923C;
  --c-heading: #F8FAFC;
  --text-main: #E2E8F0;
  --text-sub: #94A3B8;
  --text-muted: #64748B;
  --border-color: #202430;
  --border-strong: #2E3446;
  --border-highlight: rgba(255, 255, 255, 0.05);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.03);
  --shadow-float: 0 20px 44px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.07);
  --status-up-bg: rgba(16, 185, 129, 0.14);
  --status-up-text: #34D399;
  --status-warn-bg: rgba(245, 158, 11, 0.16);
  --status-warn-text: #FBBF24;
  --status-down-bg: rgba(244, 63, 94, 0.15);
  --status-down-text: #FB7185;
  /* 5-step Saffron-Copper Choropleth Scale (Dark) */
  --map-s1: #181B24;
  --map-s2: #2C261E;
  --map-s3: #5C3D16;
  --map-s4: #B46509;
  --map-s5: #F59E0B;
  --map-stroke: #0B0D12;
  --map-grid: rgba(255, 255, 255, 0.035);
  --radius-card: 10px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --sidebar-w: 242px;
  --sidebar-collapsed-w: 64px;
}

[data-theme="light"] {
  --bg-main: #F4F2EE;
  --bg-card: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-subtle: #ECE9E2;
  --bg-hover: #F7F5F0;
  --bg-accent-soft: rgba(217, 119, 6, 0.11);
  --bg-accent-muted: rgba(217, 119, 6, 0.05);
  --c-primary: #D97706;
  --c-primary-hover: #B45309;
  --c-primary-deep: #92400E;
  --c-secondary: #059669;
  --c-tertiary: #EA580C;
  --c-heading: #141413;
  --text-main: #1C1B18;
  --text-sub: #57534E;
  --text-muted: #78716C;
  --border-color: #E2DFD7;
  --border-strong: #C7C2B8;
  --border-highlight: rgba(255, 255, 255, 0.8);
  --shadow-card: 0 1px 3px rgba(20, 20, 19, 0.05), 0 1px 2px rgba(20, 20, 19, 0.03);
  --shadow-float: 0 18px 38px rgba(20, 20, 19, 0.14), 0 1px 4px rgba(20, 20, 19, 0.08);
  --status-up-bg: rgba(5, 150, 105, 0.11);
  --status-up-text: #047857;
  --status-warn-bg: rgba(217, 119, 6, 0.12);
  --status-warn-text: #B45309;
  --status-down-bg: rgba(225, 29, 72, 0.1);
  --status-down-text: #BE123C;
  /* 5-step Warm Sand-to-Saffron-to-Espresso Choropleth Scale (Light) */
  --map-s1: #EFECE6;
  --map-s2: #FDE68A;
  --map-s3: #F59E0B;
  --map-s4: #D97706;
  --map-s5: #78350F;
  --map-stroke: #FFFFFF;
  --map-grid: rgba(20, 20, 19, 0.045);
  --radius-card: 10px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --sidebar-w: 242px;
  --sidebar-collapsed-w: 64px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  direction: rtl;
  font-family: 'Vazirmatn', 'Plus Jakarta Sans', Tahoma, sans-serif;
  font-weight: 400;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color 0.18s ease, color 0.18s ease;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  font-weight: 500;
  border: none;
  background: none;
}

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--c-primary);
  outline-offset: 1px;
}

h1, h2, h3, h4, .font-heading {
  font-weight: 700;
  color: var(--c-heading);
  letter-spacing: -0.015em;
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.font-mono-code {
  font-family: 'JetBrains Mono', 'Plus Jakarta Sans', monospace;
  font-variant-numeric: tabular-nums;
}

@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-page {
  animation: pageFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

/* App Shell */
.app-shell {
  display: flex;
  min-height: 100vh;
  position: relative;
}

/* Sidebar — Linear/Raycast Enterprise Style */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-card);
  border-left: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 40;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar.collapsed {
  width: var(--sidebar-collapsed-w);
}

.sidebar-brand {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  min-height: 54px;
}

.brand-identity {
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: hidden;
}

.brand-logo {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, #F59E0B 0%, #D97706 55%, #92400E 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #090A0E;
  flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(245, 158, 11, 0.28);
}

.brand-titles {
  display: flex;
  flex-direction: column;
  white-space: nowrap;
}

.brand-name {
  font-size: 15px;
  font-weight: 800;
  color: var(--c-heading);
  display: flex;
  align-items: center;
  gap: 6px;
  line-height: 1.15;
}

.brand-version {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--c-primary);
  background: var(--bg-accent-soft);
  padding: 1px 5px;
  border-radius: 4px;
}

.brand-sub {
  font-size: 10.5px;
  color: var(--text-muted);
  margin-top: 1px;
}

.sidebar.collapsed .brand-titles,
.sidebar.collapsed .workspace-meta,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-kbd,
.sidebar.collapsed .sidebar-section-title,
.sidebar.collapsed .user-profile-meta,
.sidebar.collapsed .sidebar-binesh-card-body {
  display: none;
}

.sidebar-toggle-btn {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  flex-shrink: 0;
  transition: color 0.14s, border-color 0.14s;
}

.sidebar-toggle-btn:hover {
  color: var(--c-primary);
  border-color: var(--c-primary);
}

/* Tenant Organization Switcher */
.workspace-box {
  margin: 10px 10px 4px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 9px;
}

.workspace-avatar {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--bg-accent-soft);
  border: 1px solid rgba(245, 158, 11, 0.35);
  color: var(--c-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 11.5px;
  flex-shrink: 0;
}

.workspace-meta {
  overflow: hidden;
  flex: 1;
}

.workspace-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-heading);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.workspace-desc {
  font-size: 10.5px;
  color: var(--text-muted);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

.sidebar-section-title {
  padding: 10px 14px 4px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.01em;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 8px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 7px;
  color: var(--text-sub);
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.12s ease;
  text-align: right;
  width: 100%;
  white-space: nowrap;
  border: 1px solid transparent;
}

.nav-item-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.nav-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--text-muted);
  transition: color 0.12s ease;
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--c-heading);
}

.nav-item:hover svg {
  color: var(--c-primary);
}

.nav-item.active {
  background: var(--bg-accent-soft);
  color: var(--c-heading);
  font-weight: 700;
  border-color: rgba(245, 158, 11, 0.28);
}

.nav-item.active svg {
  color: var(--c-primary);
}

.nav-kbd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  padding: 1px 5px;
  border-radius: 4px;
}

.nav-item.active .nav-kbd {
  color: var(--c-primary);
  border-color: rgba(245, 158, 11, 0.35);
}

/* Executive User Profile + Subtle Binesh Box in Sidebar Footer */
.sidebar-footer {
  padding: 10px;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.user-profile-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
}

.user-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, #27272A 0%, #3F3F46 100%);
  border: 1.5px solid var(--c-primary);
  color: var(--c-heading);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 700;
  flex-shrink: 0;
}

.user-profile-meta {
  overflow: hidden;
  flex: 1;
}

.user-name {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-heading);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Main Content Area */
.main-viewport {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Top Command & Filter Header */
.top-header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  padding: 9px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 30;
  flex-wrap: wrap;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.mobile-menu-btn {
  display: none;
  width: 32px;
  height: 32px;
  border-radius: 7px;
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  align-items: center;
  justify-content: center;
  color: var(--text-main);
}

.page-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.page-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--c-heading);
  white-space: nowrap;
}

.demo-pill-tag {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-sub);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  padding: 2px 8px;
  border-radius: 5px;
  white-space: nowrap;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

/* Command Palette Trigger Search Input */
.global-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.global-search-input {
  width: 215px;
  height: 32px;
  padding: 0 30px 0 48px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-main);
  font-size: 12px;
  color: var(--text-main);
  transition: border-color 0.14s, width 0.18s;
}

.global-search-input:focus {
  border-color: var(--c-primary);
  background: var(--bg-card);
  width: 245px;
}

.search-icon-right {
  position: absolute;
  right: 9px;
  color: var(--text-muted);
  pointer-events: none;
  display: flex;
}

.search-kbd {
  position: absolute;
  left: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  padding: 1px 5px;
  pointer-events: none;
}

/* Segmented Time Range Filter */
.segmented-group {
  display: inline-flex;
  align-items: center;
  background: var(--bg-main);
  padding: 2px;
  border-radius: 7px;
  border: 1px solid var(--border-color);
}

.seg-btn {
  padding: 4px 9px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-sub);
  border-radius: 5px;
  transition: all 0.12s ease;
  white-space: nowrap;
}

.seg-btn:hover {
  color: var(--c-heading);
}

.seg-btn.active {
  background: var(--bg-elevated);
  color: var(--c-primary);
  font-weight: 700;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

/* Select Filter */
.select-control {
  height: 32px;
  padding: 0 9px 0 22px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background-color: var(--bg-main);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
}

/* Header Action Buttons */
.icon-action-btn {
  height: 32px;
  min-width: 32px;
  padding: 0 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-main);
  color: var(--text-sub);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  position: relative;
  transition: all 0.12s ease;
  white-space: nowrap;
}

.icon-action-btn:hover {
  border-color: var(--c-primary);
  color: var(--c-heading);
  background: var(--bg-hover);
}

.btn-primary-action {
  height: 32px;
  padding: 0 11px;
  border-radius: var(--radius-sm);
  background: var(--c-primary);
  color: #090A0E;
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background-color 0.14s ease, transform 0.12s ease;
  white-space: nowrap;
}

.btn-primary-action:hover {
  background: var(--c-primary-hover);
  transform: translateY(-1px);
}

.btn-binesh-consult {
  height: 32px;
  padding: 0 11px;
  border-radius: var(--radius-sm);
  background: var(--bg-accent-soft);
  border: 1px solid rgba(245, 158, 11, 0.42);
  color: var(--c-primary);
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.14s ease;
  white-space: nowrap;
}

.btn-binesh-consult:hover {
  background: var(--c-primary);
  color: #090A0E;
}

.notif-count {
  background: var(--c-primary);
  color: #090A0E;
  font-size: 9.5px;
  font-weight: 800;
  min-width: 15px;
  height: 15px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* Sub-header Live Operational Telemetry Strip */
.sub-telemetry-bar {
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border-color);
  padding: 6px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 11.5px;
  color: var(--text-sub);
  flex-wrap: wrap;
}

.telemetry-items {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.telemetry-sep {
  color: var(--border-strong);
}

/* Custom Date Picker Bar */
.custom-date-bar {
  background: var(--bg-accent-muted);
  border-bottom: 1px solid var(--border-color);
  padding: 7px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  flex-wrap: wrap;
}

/* Main Content Container — Dense Enterprise Grid */
.dashboard-content {
  padding: 14px 18px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 1640px;
  width: 100%;
  margin: 0 auto;
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 14px 16px;
  transition: border-color 0.15s ease;
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-heading);
  display: flex;
  align-items: center;
  gap: 7px;
}

.card-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* KPI Grid (6 dense terminal cards) */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 12px 13px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  transition: border-color 0.14s ease, transform 0.14s ease;
}

.kpi-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}

.kpi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.kpi-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kpi-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--text-muted);
}

.kpi-value-row {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.kpi-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--c-heading);
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}

.kpi-unit {
  font-size: 10.5px;
  color: var(--text-muted);
}

.kpi-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding-top: 4px;
  border-top: 1px solid var(--border-color);
}

.kpi-delta {
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-variant-numeric: tabular-nums;
  padding: 1px 5px;
  border-radius: 4px;
}

.kpi-delta.up {
  color: var(--status-up-text);
  background: var(--status-up-bg);
}

.kpi-delta.down {
  color: var(--status-down-text);
  background: var(--status-down-bg);
}

/* Insights + Target Realization Strip */
.insights-target-grid {
  display: grid;
  grid-template-columns: 1.75fr 1fr;
  gap: 12px;
}

.insights-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.insight-item {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
  text-align: right;
  transition: border-color 0.14s, background-color 0.14s;
}

.insight-item:hover {
  border-color: var(--c-primary);
  background: var(--bg-hover);
}

.insight-kicker {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--c-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.insight-text {
  font-size: 11.5px;
  color: var(--text-main);
  line-height: 1.45;
}

.target-progress-track {
  height: 8px;
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  overflow: hidden;
  margin: 8px 0 6px;
}

.target-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #D97706 0%, #F59E0B 65%, #10B981 100%);
  border-radius: 4px;
  transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Layout Grids */
.grid-2-1 {
  display: grid;
  grid-template-columns: 1.85fr 1fr;
  gap: 12px;
}

.grid-1-1 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* SVG Charts */
.chart-container {
  position: relative;
  width: 100%;
  user-select: none;
}

.chart-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

.chart-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--text-sub);
  flex-wrap: wrap;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend-swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  display: inline-block;
}

/* Hero Map Stage */
.map-workspace-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 12px;
  align-items: stretch;
}

.iran-map-stage {
  position: relative;
  background:
    linear-gradient(to right, var(--map-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--map-grid) 1px, transparent 1px),
    var(--bg-main);
  background-size: 28px 28px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  min-height: 480px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.iran-map-svg {
  width: 100%;
  max-height: 500px;
  height: auto;
  transition: transform 0.22s ease;
}

.province-path {
  stroke: var(--map-stroke);
  stroke-width: 1.2px;
  stroke-linejoin: round;
  cursor: pointer;
  transition: fill 0.18s ease, opacity 0.14s ease, stroke-width 0.14s ease;
}

.province-path:hover {
  opacity: 0.92;
  stroke: #FBBF24;
  stroke-width: 2.2px;
}

.province-path.selected {
  stroke: #10B981;
  stroke-width: 2.6px;
}

.province-label {
  font-family: 'Vazirmatn', sans-serif;
  font-size: 9px;
  font-weight: 700;
  fill: var(--c-heading);
  pointer-events: none;
  text-anchor: middle;
  paint-order: stroke;
  stroke: var(--bg-main);
  stroke-width: 2.6px;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sea-label {
  font-family: 'Vazirmatn', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  fill: var(--text-muted);
  opacity: 0.75;
  pointer-events: none;
  text-anchor: middle;
}

.map-scale-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-color);
  font-size: 11.5px;
  color: var(--text-sub);
  flex-wrap: wrap;
}

.choropleth-steps {
  display: flex;
  align-items: center;
  gap: 3px;
}

.choropleth-step {
  width: 26px;
  height: 9px;
  border-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* High-Density Data Tables */
.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
}

.data-table th {
  background: var(--bg-subtle);
  color: var(--text-muted);
  font-weight: 700;
  font-size: 11px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.data-table th.sortable {
  cursor: pointer;
  transition: color 0.14s;
}

.data-table th.sortable:hover {
  color: var(--c-primary);
}

.data-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-main);
  vertical-align: middle;
}

.data-table tbody tr {
  transition: background-color 0.1s ease;
}

.data-table tbody tr:hover {
  background-color: var(--bg-hover);
}

.data-table tbody tr.row-selected {
  background-color: var(--bg-accent-soft);
}

.data-table tbody tr:last-child td {
  border-bottom: none;
}

/* Cohort Heatmap Cells */
.cohort-cell {
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-size: 11.5px;
  font-weight: 600;
  border-radius: 4px;
  padding: 5px 4px;
  transition: transform 0.1s ease;
}

.cohort-cell:hover {
  transform: scale(1.05);
  outline: 1.5px solid var(--c-primary);
}

/* Pagination */
.pagination-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 10px;
  font-size: 11.5px;
  color: var(--text-sub);
  flex-wrap: wrap;
}

.page-btn-group {
  display: flex;
  align-items: center;
  gap: 4px;
}

.page-btn {
  min-width: 28px;
  height: 28px;
  padding: 0 7px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-main);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.page-btn.active {
  background: var(--c-primary);
  color: #090A0E;
  border-color: var(--c-primary);
  font-weight: 800;
}

.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Floating Rich HUD Tooltip */
.binesh-tooltip {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow-float);
  padding: 9px 12px;
  min-width: 195px;
  max-width: 280px;
  font-size: 11.5px;
  color: var(--text-main);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.1s ease, transform 0.1s ease;
}

.binesh-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Skeleton Shimmer during Filter Reload */
.is-loading .skeleton-target {
  position: relative;
  overflow: hidden;
}

.is-loading .skeleton-target::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(245, 158, 11, 0.12) 50%, transparent 100%);
  background-color: var(--bg-card);
  opacity: 0.76;
  animation: tarazPulse 0.4s ease-in-out infinite;
  z-index: 10;
}

@keyframes tarazPulse {
  0% { opacity: 0.5; }
  50% { opacity: 0.85; }
  100% { opacity: 0.5; }
}

/* Modals & Command Palette Overlays */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 6, 10, 0.68);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-card {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  width: 100%;
  max-width: 530px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px 22px;
  position: relative;
}

/* Notification & Search Popover */
.popover-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 330px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  box-shadow: var(--shadow-float);
  padding: 12px;
  z-index: 80;
}

/* Toast Notification */
.binesh-toast {
  position: fixed;
  bottom: 18px;
  left: 18px;
  background: var(--bg-elevated);
  color: var(--c-heading);
  border: 1px solid var(--c-primary);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: var(--shadow-float);
  z-index: 120;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-backdrop {
  display: none;
}

/* Responsive Breakpoints (1440px -> 1024px -> 390px) */
@media (max-width: 1280px) {
  .kpi-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .insights-target-grid {
    grid-template-columns: 1fr;
  }
  .map-workspace-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 1024px) {
  .grid-2-1, .grid-1-1 {
    grid-template-columns: 1fr;
  }
  .insights-list {
    grid-template-columns: 1fr;
  }
  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .sidebar {
    position: fixed;
    right: 0;
    top: 0;
    height: 100vh;
    transform: translateX(100%);
    box-shadow: var(--shadow-float);
  }
  .sidebar.mobile-open {
    transform: translateX(0);
    width: 256px;
  }
  .sidebar-backdrop.mobile-open {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 10, 0.6);
    z-index: 35;
  }
  .mobile-menu-btn {
    display: inline-flex;
  }
  .sidebar-toggle-btn {
    display: none;
  }
}

@media (max-width: 640px) {
  .top-header {
    padding: 8px 10px;
    gap: 8px;
  }
  .sub-telemetry-bar {
    padding: 5px 10px;
    font-size: 10.5px;
  }
  .dashboard-content {
    padding: 10px 10px 24px;
    gap: 10px;
  }
  .card {
    padding: 12px;
  }
  .kpi-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .kpi-card {
    padding: 10px;
  }
  .kpi-value {
    font-size: 16.5px;
  }
  .global-search-wrap {
    width: 100%;
    order: 3;
  }
  .global-search-input, .global-search-input:focus {
    width: 100%;
  }
  .header-controls {
    width: 100%;
    justify-content: space-between;
  }
  .segmented-group {
    width: 100%;
    justify-content: space-between;
    overflow-x: auto;
  }
  .seg-btn {
    padding: 4px 6px;
    font-size: 10.5px;
    flex: 1;
    text-align: center;
  }
  .grid-3 {
    grid-template-columns: 1fr;
  }
  .iran-map-stage {
    min-height: 295px;
    padding: 6px;
  }
  .popover-panel {
    width: calc(100vw - 20px);
    left: 0;
  }
}

  <script>
    (function() {
      var duration = 3000;
      var start = performance.now();
      var pctEl = document.getElementById('bdl-pct');
      var barEl = document.getElementById('bdl-bar');
      var stepEl = document.getElementById('bdl-step');
      var rowsEl = document.getElementById('bdl-rows');
      var kpisEl = document.getElementById('bdl-kpis');
      var stateEl = document.getElementById('bdl-state');
      var loaderEl = document.getElementById('binesh-demo-loader');

      function tick(now) {
        var elapsed = now - start;
        var p = Math.min(1, elapsed / duration);
        var pct = Math.round(p * 100);
        if (pctEl) pctEl.textContent = pct + '%';
        if (barEl) barEl.style.width = pct + '%';
        if (rowsEl) rowsEl.textContent = Math.round(p * 48520).toLocaleString('en-US');
        if (kpisEl) kpisEl.textContent = Math.min(24, Math.floor(p * 25)) + ' / 24';

        if (stepEl) {
          if (p < 0.35) {
            stepEl.textContent = 'در حال واکشی داده‌های پایه و بررسی یکپارچگی جداول...';
          } else if (p < 0.72) {
            stepEl.textContent = 'در حال پردازش شاخص‌های کلیدی (KPI) و محاسبه اعداد تحلیلی...';
          } else if (p < 0.98) {
            stepEl.textContent = 'در حال ترسیم نمودارها و آماده‌سازی محیط تعاملی داشبورد...';
          } else {
            stepEl.textContent = 'پردازش تکمیل شد؛ در حال بازگشایی داشبورد...';
            if (stateEl) stateEl.textContent = 'آماده نمایش';
          }
        }

        if (p < 1) {
          requestAnimationFrame(tick);
        } else {
          setTimeout(function() {
            if (loaderEl) {
              loaderEl.classList.add('is-hidden');
              setTimeout(function() {
                if (loaderEl && loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl);
              }, 380);
            }
          }, 80);
        }
      }
      requestAnimationFrame(tick);
    })();
  </script>

    function renderIranMapSvg(provinces, compact = false) {
      const metric = state.mapMetric;
      const vals = provinces.map((p) => p[metric]);
      const minV = Math.min(...vals);
      const maxV = Math.max(...vals);
      const span = maxV - minV || 1;
      function getChoroplethColor(val) {
        const ratio = (val - minV) / span;
        if (ratio >= 0.72) return "var(--map-s5)";
        if (ratio >= 0.44) return "var(--map-s4)";
        if (ratio >= 0.24) return "var(--map-s3)";
        if (ratio >= 0.11) return "var(--map-s2)";
        return "var(--map-s1)";
      }
      const metricMap = new Map(provinces.map((p, idx) => [p.id, { ...p, rank: idx + 1 }]));
      let pathsHtml = "";
      let labelsHtml = "";
      let nodesHtml = "";
      IRAN_PROVINCES_GEO.forEach((geo) => {
        const m = metricMap.get(geo.id);
        if (!m) return;
        const fill = getChoroplethColor(m[metric]);
        const isSelected = state.selectedProvinceId === geo.id;
        pathsHtml += `
        <path
          d="${geo.d}"
          fill="${fill}"
          class="province-path ${isSelected ? "selected" : ""}"
          data-province-id="${geo.id}"
          data-province-name="${geo.name}"
          data-sales="${m.sales}"
          data-orders="${m.orders}"
          data-customers="${m.customers}"
          data-growth="${m.growth}"
          data-rank="${m.rank}"
          data-branches="${m.branches}"
        />
      `;
        const [dx, dy] = PROVINCE_LABEL_OFFSETS[geo.id] || [0, 0];
        const lx = geo.cx + dx;
        const ly = geo.cy + dy;
        if (isSelected) {
          nodesHtml += `
          <circle cx="${lx}" cy="${ly - 9}" r="8" fill="#10B981" fill-opacity="0.25" pointer-events="none" />
          <circle cx="${lx}" cy="${ly - 9}" r="3.5" fill="#10B981" stroke="var(--bg-card)" stroke-width="1.5" pointer-events="none" />
        `;
        } else if (m.rank <= 8 && !compact) {
          nodesHtml += `
          <circle cx="${lx}" cy="${ly - 8}" r="2.2" fill="#FBBF24" opacity="0.85" pointer-events="none" />
        `;
        }
        labelsHtml += `
        <text x="${lx}" y="${ly}" class="province-label">${geo.name}</text>
      `;
      });
      return `
      <svg viewBox="0 0 800 720" class="iran-map-svg" style="transform: scale(${compact ? 1 : state.mapZoom})">
        <defs>
          <radialGradient id="seaAmberGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.09" />
            <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
          </radialGradient>
        </defs>
        <!-- Geographic Coordinates & Sea Markers -->
        <line x1="20" y1="180" x2="780" y2="180" stroke="var(--border-color)" stroke-dasharray="2 6" stroke-width="0.8" />
        <line x1="20" y1="360" x2="780" y2="360" stroke="var(--border-color)" stroke-dasharray="2 6" stroke-width="0.8" />
        <line x1="20" y1="540" x2="780" y2="540" stroke="var(--border-color)" stroke-dasharray="2 6" stroke-width="0.8" />
        <ellipse cx="355" cy="115" rx="95" ry="26" fill="url(#seaAmberGlow)" />
        <text x="355" y="118" class="sea-label">\u062F\u0631\u06CC\u0627\u06CC \u062E\u0632\u0631 (CASPIAN SEA)</text>
        <ellipse cx="345" cy="595" rx="130" ry="30" fill="url(#seaAmberGlow)" />
        <text x="335" y="595" class="sea-label">\u062E\u0644\u06CC\u062C \u0641\u0627\u0631\u0633 (PERSIAN GULF)</text>
        <text x="615" y="665" class="sea-label">\u062F\u0631\u06CC\u0627\u06CC \u0639\u0645\u0627\u0646</text>

        <g class="provinces-layer">
          ${pathsHtml}
        </g>

          ${nodesHtml}

    function renderCustomersPage() {
      const mult = TIME_RANGE_CONFIG[state.timeRange].multiplier * getChannelMultiplier();
      let cumulativePct = 0;
      const radius = 70;
      const circumference = 2 * Math.PI * radius;
      const donutSlicesHtml = CUSTOMER_SEGMENTS.map((seg) => {
        const strokeDasharray = `${seg.share / 100 * circumference} ${circumference}`;
        const strokeDashoffset = -(cumulativePct / 100 * circumference);
        cumulativePct += seg.share;
        const isSelected = state.selectedSegmentId === seg.id;
        return `
        <circle
          cx="100"
          cy="100"
          r="${radius}"
          fill="transparent"
          stroke="${seg.color}"
          stroke-width="${isSelected ? 26 : 20}"
          stroke-dasharray="${strokeDasharray}"
          stroke-dashoffset="${strokeDashoffset}"
          style="cursor:pointer;transition:stroke-width 0.18s ease, opacity 0.18s ease;"
          opacity="${state.selectedSegmentId === "all" || isSelected ? 1 : 0.4}"
          data-select-segment="${seg.id}"
        />
      `;
      }).join("");
      const activeSegObj = CUSTOMER_SEGMENTS.find((s) => s.id === state.selectedSegmentId);
      const centerTitle = activeSegObj ? activeSegObj.name.split(" ")[0] + " " + (activeSegObj.name.split(" ")[1] || "") : "\u06A9\u0644 \u0628\u0627\u0634\u06AF\u0627\u0647";
      const centerCount = activeSegObj ? Math.round(activeSegObj.count * (0.45 + 0.55 * mult)) : Math.round(654200 * (0.45 + 0.55 * mult));
      const filteredCustomers = CUSTOMERS_TABLE.filter((c) => state.selectedSegmentId === "all" || c.segment === state.selectedSegmentId).filter((c) => !state.customerSearch || c.name.includes(state.customerSearch) || c.city.includes(state.customerSearch) || c.id.toLowerCase().includes(state.customerSearch.toLowerCase())).sort((a, b) => {
        const dir = state.customerSortDir === "asc" ? 1 : -1;
        return (a[state.customerSortBy] - b[state.customerSortBy]) * dir;
      });
      const pageSize = 6;
      const totalPages = Math.max(1, Math.ceil(filteredCustomers.length / pageSize));
      const safePage = Math.min(state.customerPage, totalPages);
      const pagedCustomers = filteredCustomers.slice((safePage - 1) * pageSize, safePage * pageSize);
      return `
      <div class="animate-page" style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
          ${CUSTOMER_SEGMENTS.map((seg) => {
        const isSelected = state.selectedSegmentId === seg.id;
        const scaledCount = Math.round(seg.count * (0.45 + 0.55 * mult));
        return `
              <div
                class="card skeleton-target"
                style="cursor:pointer;border-color:${isSelected ? "var(--c-primary)" : "var(--border-color)"};background:${isSelected ? "var(--bg-accent-soft)" : "var(--bg-card)"}"
                data-select-segment="${seg.id}"
              >
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
                  <span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c-heading)">
                    <span style="width:9px;height:9px;border-radius:2px;background:${seg.color}"></span>
                    ${seg.name}
                  </span>
                  <span class="tabular-nums" style="font-size:11.5px;font-weight:700;color:${seg.growth >= 0 ? "var(--status-up-text)" : "var(--status-down-text)"}">
                    ${seg.growth >= 0 ? "+" : ""}${formatFaNum(seg.growth, 1)}\u066A
                  </span>
                </div>
                <div style="display:flex;align-items:baseline;justify-content:space-between;margin:6px 0;">
                  <span class="tabular-nums" style="font-size:19.5px;font-weight:800;color:var(--c-heading)">${formatFaNum(scaledCount)} \u0646\u0641\u0631</span>
                  <span class="tabular-nums" style="font-size:11.5px;color:var(--c-primary);font-weight:700;">\u0633\u0647\u0645: ${formatFaNum(seg.share)}\u066A</span>
                </div>
                <div style="font-size:11px;color:var(--text-sub);line-height:1.42;">${seg.desc}</div>
              </div>
            `;
      }).join("")}

        <div class="grid-1-1">

              <div class="card-subtitle">\u062C\u0633\u062A\u062C\u0648\u060C \u0645\u0631\u062A\u0628\u200C\u0633\u0627\u0632\u06CC \u0628\u0631 \u0627\u0633\u0627\u0633 \u0627\u0631\u0632\u0634 \u0637\u0648\u0644 \u0639\u0645\u0631 (LTV) \u0648 \u0641\u06CC\u0644\u062A\u0631 \u0628\u062E\u0634\u200C\u0628\u0646\u062F\u06CC</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <input
                type="text"
                class="global-search-input"
                style="width:205px;padding-left:10px;"
                placeholder="\u062C\u0633\u062A\u062C\u0648\u06CC \u0646\u0627\u0645\u060C \u0634\u0647\u0631 \u06CC\u0627 \u06A9\u062F..."
                value="${state.customerSearch}"
                data-customer-search="true"
              />
              <select class="select-control" data-customer-segment-select="true">
                <option value="all" ${state.selectedSegmentId === "all" ? "selected" : ""}>\u0647\u0645\u0647 \u0628\u062E\u0634\u200C\u0647\u0627\u06CC \u0645\u0634\u062A\u0631\u06CC\u0627\u0646</option>
                <option value="loyal" ${state.selectedSegmentId === "loyal" ? "selected" : ""}>\u0645\u0634\u062A\u0631\u06CC\u0627\u0646 \u0648\u0641\u0627\u062F\u0627\u0631 VIP</option>
                <option value="new" ${state.selectedSegmentId === "new" ? "selected" : ""}>\u0645\u0634\u062A\u0631\u06CC\u0627\u0646 \u062C\u062F\u06CC\u062F</option>
                <option value="at_risk" ${state.selectedSegmentId === "at_risk" ? "selected" : ""}>\u062F\u0631 \u062E\u0637\u0631 \u0631\u06CC\u0632\u0634</option>
                <option value="hibernating" ${state.selectedSegmentId === "hibernating" ? "selected" : ""}>\u0645\u0634\u062A\u0631\u06CC\u0627\u0646 \u062E\u0641\u062A\u0647</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>\u0634\u0646\u0627\u0633\u0647 \u0645\u0634\u062A\u0631\u06CC</th>
                  <th>\u0646\u0627\u0645 \u0648 \u0646\u0627\u0645 \u062E\u0627\u0646\u0648\u0627\u062F\u06AF\u06CC</th>
                  <th>\u0634\u0647\u0631</th>
                  <th>\u0633\u06AF\u0645\u0646\u062A</th>
                  <th class="sortable" data-cust-sort="orders">\u062A\u0639\u062F\u0627\u062F \u062E\u0631\u06CC\u062F ${state.customerSortBy === "orders" ? state.customerSortDir === "desc" ? "\u25BC" : "\u25B2" : ""}</th>
                  <th class="sortable" data-cust-sort="ltv">\u0627\u0631\u0632\u0634 \u0637\u0648\u0644 \u0639\u0645\u0631 LTV ${state.customerSortBy === "ltv" ? state.customerSortDir === "desc" ? "\u25BC" : "\u25B2" : ""}</th>
                  <th>\u0622\u062E\u0631\u06CC\u0646 \u062E\u0631\u06CC\u062F</th>
                  <th class="sortable" data-cust-sort="risk">\u0634\u0627\u062E\u0635 \u0631\u06CC\u0633\u06A9 \u0631\u06CC\u0632\u0634 ${state.customerSortBy === "risk" ? state.customerSortDir === "desc" ? "\u25BC" : "\u25B2" : ""}</th>
                </tr>
              </thead>
              <tbody>
                ${pagedCustomers.length === 0 ? `
                  <tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)">\u0645\u0648\u0631\u062F\u06CC \u0645\u0637\u0627\u0628\u0642 \u0628\u0627 \u062C\u0633\u062A\u062C\u0648\u06CC \u0634\u0645\u0627 \u06CC\u0627\u0641\u062A \u0646\u0634\u062F.</td></tr>
                ` : pagedCustomers.map((c) => `
                  <tr>
                    <td class="font-mono-code" style="font-size:11px;color:var(--text-muted)">${c.id}</td>
                    <td style="font-weight:700;color:var(--c-heading)">${c.name}</td>
                    <td>${c.city}</td>
                    <td style="color:var(--c-primary);font-weight:600;">${c.segmentLabel}</td>
                    <td class="tabular-nums">${formatFaNum(c.orders)} \u0641\u0627\u06A9\u062A\u0648\u0631</td>
                    <td class="tabular-nums" style="font-weight:700;">${formatFaNum(c.ltv, 1)} \u0645\u06CC\u0644\u06CC\u0648\u0646 \u062A</td>
                    <td style="color:var(--text-sub)">${c.lastPurchase}</td>
                    <td>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <div style="width:60px;height:5px;background:var(--bg-subtle);border-radius:3px;overflow:hidden;">
                          <div style="width:${c.risk}%;height:100%;background:${c.risk > 50 ? "#F43F5E" : c.risk > 20 ? "#F59E0B" : "#10B981"}"></div>
                        </div>
                        <span class="tabular-nums" style="font-size:11.5px;font-weight:700;color:${c.risk > 50 ? "var(--status-down-text)" : "var(--status-up-text)"}">${formatFaNum(c.risk)}\u066A</span>
                      </div>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>

          <div class="pagination-bar">
            <span>\u0646\u0645\u0627\u06CC\u0634 ${formatFaNum(pagedCustomers.length)} \u0627\u0632 ${formatFaNum(filteredCustomers.length)} \u067E\u0631\u0648\u0646\u062F\u0647 \u0645\u0634\u062A\u0631\u06CC</span>
            <div class="page-btn-group">
              <button class="page-btn" data-cust-page="${safePage - 1}" ${safePage <= 1 ? "disabled" : ""}>\u0642\u0628\u0644\u06CC</button>
              ${Array.from({ length: totalPages }, (_, i) => i + 1).map((p) => `
                <button class="page-btn ${p === safePage ? "active" : ""}" data-cust-page="${p}">${formatFaNum(p)}</button>
              `).join("")}
              <button class="page-btn" data-cust-page="${safePage + 1}" ${safePage >= totalPages ? "disabled" : ""}>\u0628\u0639\u062F\u06CC</button>
            </div>
          </div>
        </div>
      </div>
    `;
    }
    function renderProductsPage() {
      const categories = ["all", "\u062E\u0648\u0627\u0631\u0628\u0627\u0631 \u0648 \u0627\u0633\u0627\u0633\u06CC", "\u0644\u0628\u0646\u06CC\u0627\u062A \u0648 \u067E\u0631\u0648\u062A\u0626\u06CC\u0646\u06CC", "\u0634\u0648\u06CC\u0646\u062F\u0647 \u0648 \u0628\u0647\u062F\u0627\u0634\u062A\u06CC", "\u0646\u0648\u0634\u06CC\u062F\u0646\u06CC \u0648 \u062A\u0646\u0642\u0644\u0627\u062A", "\u0644\u0648\u0627\u0632\u0645 \u062E\u0627\u0646\u06AF\u06CC \u0633\u0628\u06A9"];
      const mult = TIME_RANGE_CONFIG[state.timeRange].multiplier * getChannelMultiplier();
      const filteredProducts = PRODUCTS_DATA.filter((p) => state.productCategory === "all" || p.category === state.productCategory).filter((p) => !state.productSearch || p.name.includes(state.productSearch)).map((p) => ({
        ...p,
        volumeScaled: +(p.volume * mult).toFixed(1),
        revenueScaled: +(p.revenue * mult).toFixed(1)
      })).sort((a, b) => {
        if (state.productSortBy === "revenue") return b.revenueScaled - a.revenueScaled;
        if (state.productSortBy === "volume") return b.volumeScaled - a.volumeScaled;
        if (state.productSortBy === "price") return b.price - a.price;
        if (state.productSortBy === "margin") return b.margin - a.margin;
        return b.growth - a.growth;
      });
      const W = 680;
      const H = 255;
      const padL = 34;
      const padR = 46;
      const padT = 20;
      const padB = 34;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxVol = Math.max(...filteredProducts.map((p) => p.volumeScaled), 10) * 1.12;
      const maxPrice = Math.max(...filteredProducts.map((p) => Math.sqrt(p.price)), 20) * 1.08;
      const catColors = {
        "\u062E\u0648\u0627\u0631\u0628\u0627\u0631 \u0648 \u0627\u0633\u0627\u0633\u06CC": "#F59E0B",
        "\u0644\u0628\u0646\u06CC\u0627\u062A \u0648 \u067E\u0631\u0648\u062A\u0626\u06CC\u0646\u06CC": "#10B981",
        "\u0634\u0648\u06CC\u0646\u062F\u0647 \u0648 \u0628\u0647\u062F\u0627\u0634\u062A\u06CC": "#FB923C",
        "\u0646\u0648\u0634\u06CC\u062F\u0646\u06CC \u0648 \u062A\u0646\u0642\u0644\u0627\u062A": "#F43F5E",
        "\u0644\u0648\u0627\u0632\u0645 \u062E\u0627\u0646\u06AF\u06CC \u0633\u0628\u06A9": "#EAB308"
      };
      let scatterNodesHtml = "";
      filteredProducts.forEach((p) => {
        const x = padL + Math.sqrt(p.price) / maxPrice * plotW;
        const y = padT + plotH - p.volumeScaled / maxVol * plotH;
        const r = Math.max(7, Math.min(19, Math.sqrt(p.revenueScaled) * 1.8));
        const col = catColors[p.category] || "#F59E0B";
        const isSel = state.selectedProductId === p.id;
        scatterNodesHtml += `
        <g
          class="scatter-point"
          style="cursor:pointer"
          data-product-id="${p.id}"
          data-name="${p.name}"
          data-price="${p.price}"
          data-vol="${p.volumeScaled}"
          data-rev="${p.revenueScaled}"
          data-margin="${p.margin}"
        >
          <circle
            cx="${x.toFixed(1)}"
            cy="${y.toFixed(1)}"
            r="${isSel ? r + 3 : r}"
            fill="${col}"
            fill-opacity="${isSel ? "0.94" : "0.74"}"
            stroke="${isSel ? "#FFFFFF" : "var(--bg-card)"}"
            stroke-width="${isSel ? "2.5" : "1.4"}"
          />
        </g>
      `;
      });
      return `
      <div class="animate-page" style="display:flex;flex-direction:column;gap:12px;">
        <div class="card skeleton-target" style="padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:12px;font-weight:700;color:var(--c-heading)">\u0641\u06CC\u0644\u062A\u0631 \u06AF\u0631\u0648\u0647 \u06A9\u0627\u0644\u0627\u06CC\u06CC:</span>
            <div class="segmented-group">
              ${categories.map((cat) => `
                <button class="seg-btn ${state.productCategory === cat ? "active" : ""}" data-prod-cat="${cat}">
                  ${cat === "all" ? "\u0647\u0645\u0647 \u062F\u0633\u062A\u0647\u200C\u0647\u0627" : cat}
                </button>
              `).join("")}
            </div>
          </div>
          <div style="font-size:11.5px;color:var(--text-sub)">
            \u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0641\u0639\u0627\u0644 \u062F\u0631 \u0645\u0627\u062A\u0631\u06CC\u0633: <strong class="tabular-nums" style="color:var(--c-primary)">${formatFaNum(filteredProducts.length)} SKU \u0627\u0635\u0644\u06CC</strong>
          </div>
        </div>

        <div class="grid-2-1">
          <div class="card skeleton-target">
            <div class="card-header">
              <div>
                <div class="card-title">\u0645\u0627\u062A\u0631\u06CC\u0633 \u067E\u0631\u0627\u06A9\u0646\u062F\u06AF\u06CC \u0642\u06CC\u0645\u062A \u0648\u0627\u062D\u062F \u062F\u0631 \u0628\u0631\u0627\u0628\u0631 \u062D\u062C\u0645 \u0641\u0631\u0648\u0634 \u0648 \u062F\u0631\u0622\u0645\u062F (Price-Volume Scatter)</div>
                <div class="card-subtitle">\u0634\u0639\u0627\u0639 \u0647\u0631 \u062D\u0628\u0627\u0628 \u0645\u062A\u0646\u0627\u0633\u0628 \u0628\u0627 \u062F\u0631\u0622\u0645\u062F \u06A9\u0644 SKU \u0627\u0633\u062A \u2014 \u0631\u0648\u06CC \u062D\u0628\u0627\u0628\u200C\u0647\u0627 \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F</div>
              </div>
            </div>
            <div class="chart-container">
              <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
                <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--border-strong)" stroke-width="1" />
                <line x1="${W - padR}" y1="${padT}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--border-strong)" stroke-width="1" />
                <line x1="${padL}" y1="${padT + plotH * 0.5}" x2="${W - padR}" y2="${padT + plotH * 0.5}" stroke="var(--border-color)" stroke-dasharray="4 4" />
                <line x1="${padL + plotW * 0.5}" y1="${padT}" x2="${padL + plotW * 0.5}" y2="${padT + plotH}" stroke="var(--border-color)" stroke-dasharray="4 4" />
                <text x="${padL + plotW / 2}" y="${H - 7}" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">\u0645\u062D\u0648\u0631 \u0627\u0641\u0642\u06CC: \u0642\u06CC\u0645\u062A \u0648\u0627\u062D\u062F \u06A9\u0627\u0644\u0627 (\u0647\u0632\u0627\u0631 \u062A\u0648\u0645\u0627\u0646) \u2190</text>
                <text x="${W - 6}" y="${padT + 10}" font-size="10" fill="var(--text-muted)" text-anchor="end">\u062D\u062C\u0645 \u0641\u0631\u0648\u0634</text>
                ${scatterNodesHtml}
              </svg>
            </div>
          </div>

          <div class="card skeleton-target" style="display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div class="card-header">
                <div>
                  <div class="card-title">\u06A9\u0627\u0644\u0627\u0647\u0627\u06CC \u0627\u0633\u062A\u0631\u0627\u062A\u0698\u06CC\u06A9 \u06AF\u0631\u0648\u0647 A (\u067E\u0627\u0631\u062A\u0648 \u06F8\u06F0/\u06F2\u06F0)</div>
                  <div class="card-subtitle">\u0628\u06CC\u0634\u062A\u0631\u06CC\u0646 \u0633\u0647\u0645 \u062F\u0631 \u0633\u0648\u062F\u0622\u0648\u0631\u06CC \u0646\u0627\u062E\u0627\u0644\u0635 \u0632\u0646\u062C\u06CC\u0631\u0647</div>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${filteredProducts.slice(0, 4).map((p, i) => `
                  <div
                    style="padding:9px 11px;border-radius:8px;background:${state.selectedProductId === p.id ? "var(--bg-accent-soft)" : "var(--bg-main)"};border:1px solid ${state.selectedProductId === p.id ? "var(--c-primary)" : "var(--border-color)"};cursor:pointer;"
                    data-select-product="${p.id}"
                  >
                    <div style="font-size:12px;font-weight:700;color:var(--c-heading)">${formatFaNum(i + 1)}. ${p.name}</div>
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text-sub);">
                      <span>\u062F\u0631\u0622\u0645\u062F: <strong class="tabular-nums" style="color:var(--c-primary)">${formatFaNum(p.revenueScaled, 1)} \u0645\u06CC\u0644\u06CC\u0627\u0631\u062F \u062A</strong></span>
                      <span>\u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F: <strong class="tabular-nums" style="color:var(--c-secondary)">${formatFaNum(p.margin, 1)}\u066A</strong></span>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
            <div style="padding-top:8px;border-top:1px solid var(--border-color);font-size:11.5px;color:var(--text-sub);">
              \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0645\u0648\u0632\u0648\u0646 \u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F \u0633\u0628\u062F: <strong class="tabular-nums" style="color:var(--c-primary)">\u06F2\u06F4\u066B\u06F1\u066A</strong>
            </div>
          </div>
        </div>

        <div class="card skeleton-target">
          <div class="table-toolbar">
            <div>
              <div class="card-title">\u062C\u062F\u0648\u0644 \u0639\u0645\u0644\u06A9\u0631\u062F SKU\u0647\u0627 \u0648 \u067E\u0627\u06CC\u0634 \u0645\u0648\u062C\u0648\u062F\u06CC \u0627\u0646\u0628\u0627\u0631</div>
              <div class="card-subtitle">\u0645\u0631\u062A\u0628\u200C\u0633\u0627\u0632\u06CC \u0628\u0631 \u0627\u0633\u0627\u0633 \u062F\u0631\u0622\u0645\u062F\u060C \u062D\u062C\u0645 \u0641\u0631\u0648\u0634\u060C \u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F \u0648 \u0631\u0648\u0646\u062F \u06F6 \u062F\u0648\u0631\u0647 \u0627\u062E\u06CC\u0631</div>
            </div>
            <input
              type="text"
              class="global-search-input"
              style="width:210px;padding-left:10px;"
              placeholder="\u062C\u0633\u062A\u062C\u0648\u06CC \u0646\u0627\u0645 \u06CC\u0627 \u06A9\u062F \u06A9\u0627\u0644\u0627..."
              value="${state.productSearch}"
              data-product-search="true"
            />
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>\u06A9\u062F SKU</th>
                  <th>\u0646\u0627\u0645 \u0645\u062D\u0635\u0648\u0644</th>
                  <th>\u062F\u0633\u062A\u0647\u200C\u0628\u0646\u062F\u06CC</th>
                  <th class="sortable" data-prod-sort="price">\u0642\u06CC\u0645\u062A \u0648\u0627\u062D\u062F (\u0647\u0632\u0627\u0631 \u062A) ${state.productSortBy === "price" ? "\u25BC" : ""}</th>
                  <th class="sortable" data-prod-sort="volume">\u062D\u062C\u0645 \u0641\u0631\u0648\u0634 (\u0647\u0632\u0627\u0631 \u0639\u062F\u062F) ${state.productSortBy === "volume" ? "\u25BC" : ""}</th>
                  <th class="sortable" data-prod-sort="revenue">\u062F\u0631\u0622\u0645\u062F \u06A9\u0644 (\u0645\u06CC\u0644\u06CC\u0627\u0631\u062F \u062A) ${state.productSortBy === "revenue" ? "\u25BC" : ""}</th>
                  <th class="sortable" data-prod-sort="margin">\u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F ${state.productSortBy === "margin" ? "\u25BC" : ""}</th>
                  <th>\u0648\u0636\u0639\u06CC\u062A \u0627\u0646\u0628\u0627\u0631</th>
                  <th class="sortable" data-prod-sort="growth">\u0631\u0634\u062F \u0648 \u0631\u0648\u0646\u062F ${state.productSortBy === "growth" ? "\u25BC" : ""}</th>
                </tr>
              </thead>
              <tbody>
                ${filteredProducts.map((p) => `
                  <tr class="${state.selectedProductId === p.id ? "row-selected" : ""}" style="cursor:pointer" data-select-product="${p.id}">
                    <td class="font-mono-code" style="font-size:11px;color:var(--text-muted)">${p.id}</td>
                    <td style="font-weight:700;color:var(--c-heading)">${p.name}</td>
                    <td style="color:var(--text-sub)">${p.category}</td>
                    <td class="tabular-nums">${formatFaNum(p.price)}</td>
                    <td class="tabular-nums">${formatFaNum(p.volumeScaled, 1)}</td>
                    <td class="tabular-nums" style="font-weight:800;color:var(--c-primary)">${formatFaNum(p.revenueScaled, 1)}</td>
                    <td class="tabular-nums">${formatFaNum(p.margin, 1)}\u066A</td>
                    <td style="font-weight:700;color:${p.stock === "\u0647\u0634\u062F\u0627\u0631 \u0645\u0648\u062C\u0648\u062F\u06CC" ? "var(--status-down-text)" : p.stock === "\u062F\u0631 \u062D\u0627\u0644 \u0633\u0641\u0627\u0631\u0634" ? "var(--status-warn-text)" : "var(--status-up-text)"}">${p.stock}</td>
                    <td>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <span class="tabular-nums" style="font-weight:700;min-width:44px;color:${p.growth >= 0 ? "var(--status-up-text)" : "var(--status-down-text)"}">${p.growth >= 0 ? "+" : ""}${formatFaNum(p.growth, 1)}\u066A</span>
                        ${renderSparkline(p.trend, p.growth >= 0 ? "#F59E0B" : "#F43F5E", 62, 20)}
                      </div>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
    }
    function renderBranchesPage() {
      const mult = TIME_RANGE_CONFIG[state.timeRange].multiplier * getChannelMultiplier();
      const formats = ["all", "\u0647\u0627\u06CC\u067E\u0631\u0645\u0627\u0631\u06A9\u062A \u0645\u0631\u06A9\u0632\u06CC", "\u0633\u0648\u067E\u0631\u0645\u0627\u0631\u06A9\u062A \u0634\u0647\u0631\u06CC", "\u0634\u0639\u0628\u0647 \u0627\u06A9\u0633\u067E\u0631\u0633"];

        ...b,

        targetScaled: +(b.target * mult).toFixed(1),
        ordersScaled: Math.round(b.orders * mult),
        realization: Math.round(b.sales / b.target * 100)

      const maxChartVal = Math.max(...topForChart.map((b) => state.branchChartMetric === "sales" ? Math.max(b.salesScaled, b.targetScaled) : b.sqmSales), 10) * 1.12;
      const comparedBranches = BRANCHES_DATA.filter((b) => state.comparedBranchIds.includes(b.id)).map((b) => ({
        ...b,
        salesScaled: +(b.sales * mult).toFixed(1),

        realization: Math.round(b.sales / b.target * 100)

      return `
      <div class="animate-page" style="display:flex;flex-direction:column;gap:12px;">

                <button class="seg-btn ${state.branchFormat === f ? "active" : ""}" data-branch-format="${f}">
                  ${f === "all" ? "\u0647\u0645\u0647 \u0634\u0639\u0628 \u0632\u0646\u062C\u06CC\u0631\u0647" : f}

              `).join("")}
            </div>
          </div>
          <div style="font-size:11.5px;color:var(--text-sub)">
            \u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u062A\u062D\u0642\u0642 \u0647\u062F\u0641 \u0634\u0639\u0628: <strong class="tabular-nums" style="color:var(--status-up-text)">\u06F1\u06F0\u06F6\u066B\u06F4\u066A</strong> \xB7 \u0634\u0627\u062E\u0635 \u0631\u0636\u0627\u06CC\u062A CSAT: <strong class="tabular-nums" style="color:var(--c-primary)">\u06F9\u06F3 \u0627\u0632 \u06F1\u06F0\u06F0</strong>

        </div>

        <div class="grid-2-1">

            <div class="card-header">
              <div>
                <div class="card-title">\u0646\u0645\u0648\u062F\u0627\u0631 \u0645\u0642\u0627\u06CC\u0633\u0647 \u0639\u0645\u0644\u06A9\u0631\u062F \u0648 \u0628\u0647\u0631\u0647\u200C\u0648\u0631\u06CC \u0634\u0639\u0628 \u0628\u0631\u062A\u0631</div>
                <div class="card-subtitle">\u0645\u0642\u0627\u06CC\u0633\u0647 \u0641\u0631\u0648\u0634 \u0648\u0627\u0642\u0639\u06CC \u0645\u062D\u0642\u0642\u200C\u0634\u062F\u0647 \u0628\u0627 \u062E\u0637 \u0647\u062F\u0641 \u062F\u0648\u0631\u0647 (\u062E\u0637 \u0639\u0645\u0648\u062F\u06CC \u0633\u0628\u0632)</div>
              </div>
              <div class="segmented-group">
                <button class="seg-btn ${state.branchChartMetric === "sales" ? "active" : ""}" data-branch-metric="sales">\u0641\u0631\u0648\u0634 \u062F\u0631 \u0628\u0631\u0627\u0628\u0631 \u0647\u062F\u0641</button>
                <button class="seg-btn ${state.branchChartMetric === "sqmSales" ? "active" : ""}" data-branch-metric="sqmSales">\u0641\u0631\u0648\u0634 \u0647\u0631 \u0645\u062A\u0631\u0645\u0631\u0628\u0639</button>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:11px;margin-top:6px;">
              ${topForChart.map((b) => {
        const val = state.branchChartMetric === "sales" ? b.salesScaled : b.sqmSales;
        const pct = Math.min(100, val / maxChartVal * 100);

        return `

                      <span class="tabular-nums" style="font-weight:700;color:var(--c-primary)">
                        ${state.branchChartMetric === "sales" ? `${formatFaNum(b.salesScaled, 1)} \u0645\u06CC\u0644\u06CC\u0627\u0631\u062F \u062A (\u0647\u062F\u0641: ${formatFaNum(b.targetScaled, 1)})` : `${formatFaNum(b.sqmSales, 1)} \u0645\u06CC\u0644\u06CC\u0648\u0646 \u062A / \u0645\u062A\u0631\u0645\u0631\u0628\u0639`}

                      ${state.branchChartMetric === "sales" ? `<div style="position:absolute;top:0;bottom:0;right:${targetPct.toFixed(1)}%;width:2.5px;background:#10B981" title="\u0647\u062F\u0641 \u0634\u0639\u0628\u0647"></div>` : ""}

                  </div>

      }).join("")}

          </div>

          <div class="card skeleton-target">
            <div class="card-header">
              <div>
                <div class="card-title">\u0645\u0642\u0627\u06CC\u0633\u0647 \u0631\u0648-\u062F\u0631-\u0631\u0648 \u0634\u0639\u0628 \u0645\u0646\u062A\u062E\u0628 (Benchmarking)</div>
                <div class="card-subtitle">\u062F\u0631 \u062C\u062F\u0648\u0644 \u067E\u0627\u06CC\u06CC\u0646 \u0631\u0648\u06CC \u062F\u06A9\u0645\u0647 \xAB\u0645\u0642\u0627\u06CC\u0633\u0647\xBB \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F (\u062D\u062F\u0627\u06A9\u062B\u0631 \u06F3 \u0634\u0639\u0628\u0647)</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:9px;">
              ${comparedBranches.map((cb) => `
                <div style="padding:10px 11px;border-radius:8px;background:var(--bg-accent-soft);border:1px solid rgba(245,158,11,0.28);">
                  <div style="display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-size:12.5px;font-weight:700;color:var(--c-heading)">${cb.name}</span>
                    <span class="tabular-nums" style="font-size:11.5px;font-weight:700;color:var(--status-up-text)">\u062A\u062D\u0642\u0642: ${formatFaNum(cb.realization)}\u066A</span>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border-color);font-size:11px;">
                    <div>
                      <div style="color:var(--text-muted)">\u0641\u0631\u0648\u0634 \u062F\u0648\u0631\u0647</div>
                      <div class="tabular-nums" style="font-weight:700;margin-top:1px;">${formatFaNum(cb.salesScaled, 1)} \u0645\u06CC\u0644\u06CC\u0627\u0631\u062F</div>
                    </div>
                    <div>
                      <div style="color:var(--text-muted)">\u0645\u06CC\u0627\u0646\u06AF\u06CC\u0646 \u0633\u0628\u062F</div>
                      <div class="tabular-nums" style="font-weight:700;margin-top:1px;">${formatFaNum(cb.avgBasket)} \u0647\u0632\u0627\u0631 \u062A</div>
                    </div>
                    <div>
                      <div style="color:var(--text-muted)">\u0631\u0636\u0627\u06CC\u062A CSAT</div>
                      <div class="tabular-nums" style="font-weight:700;margin-top:1px;">${formatFaNum(cb.csat)} \u0627\u0632 \u06F1\u06F0\u06F0</div>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>

        <div class="card skeleton-target">
          <div class="table-toolbar">

              <div class="card-subtitle">\u0631\u062A\u0628\u0647\u200C\u0628\u0646\u062F\u06CC \u0628\u0631 \u0627\u0633\u0627\u0633 \u0641\u0631\u0648\u0634\u060C \u062A\u062D\u0642\u0642 \u0628\u0648\u062F\u062C\u0647\u060C \u0628\u0647\u0631\u0647\u200C\u0648\u0631\u06CC \u0645\u0633\u0627\u062D\u062A \u0648 \u0631\u0636\u0627\u06CC\u062A \u0645\u0634\u062A\u0631\u06CC\u0627\u0646</div>
            </div>
            <input
              type="text"
              class="global-search-input"
              style="width:210px;padding-left:10px;"
              placeholder="\u062C\u0633\u062A\u062C\u0648\u06CC \u0646\u0627\u0645 \u0634\u0639\u0628\u0647 \u06CC\u0627 \u0627\u0633\u062A\u0627\u0646..."

          <div class="table-responsive">

                  <th>\u0641\u0631\u0648\u0634 \u062F\u0648\u0631\u0647 (\u0645\u06CC\u0644\u06CC\u0627\u0631\u062F \u062A)</th>
                  <th>\u062A\u0627\u0631\u06AF\u062A \u062F\u0648\u0631\u0647</th>
                  <th>\u062A\u062D\u0642\u0642 \u0647\u062F\u0641</th>
                  <th>\u062A\u0639\u062F\u0627\u062F \u0641\u0627\u06A9\u062A\u0648\u0631</th>
                  <th>\u0641\u0631\u0648\u0634 \u0647\u0631 \u0645\u062A\u0631\u0645\u0631\u0628\u0639</th>

                ${filteredBranches.map((b) => {

        return `
                    <tr class="${isCompared ? "row-selected" : ""}">
                      <td>

                          class="seg-btn ${isCompared ? "active" : ""}"

                      <td style="color:var(--text-sub)">${b.manager}</td>

      }).join("")}
              </tbody>
            </table>
          </div>
        </div>

    function animateNumbers() {
      const els = rootEl.querySelectorAll(".count-up");
      els.forEach((el) => {
        const target = parseFloat(el.getAttribute("data-target") || "0");
        const decimals = parseInt(el.getAttribute("data-decimals") || "0", 10);
        const duration = 340;
        const startTime = performance.now();
        const startVal = target * 0.76;
        function step(now) {
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = startVal + (target - startVal) * eased;
          el.textContent = formatFaNum(current, decimals);
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }
