            <span style="color:var(--text-sub)">\u0646\u0631\u062E \u062A\u063A\u06CC\u06CC\u0631:</span>
            <strong class="tabular-nums" style="color:var(--status-up-text)">+${formatFaNum(growth, 1)}\u066A</strong>
          </div>
        `, e.clientX, e.clientY);
        });
        pt.addEventListener("mouseleave", hideTooltip);
      });
      rootEl.querySelectorAll(".province-path").forEach((path) => {
        path.addEventListener("mousemove", (e) => {
          const name = path.getAttribute("data-province-name") || "";
          const sales = parseFloat(path.getAttribute("data-sales") || "0");
          const orders = parseInt(path.getAttribute("data-orders") || "0", 10);
          const customers = parseInt(path.getAttribute("data-customers") || "0", 10);
          const growth = parseFloat(path.getAttribute("data-growth") || "0");
          const rank = parseInt(path.getAttribute("data-rank") || "1", 10);
          const branches = parseInt(path.getAttribute("data-branches") || "1", 10);
          showTooltip(`
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border-color);">
            <strong style="font-size:12.5px;color:var(--c-heading)">\u0627\u0633\u062A\u0627\u0646 ${name}</strong>
            <span style="font-size:10.5px;color:var(--c-primary);font-weight:700;">\u0631\u062A\u0628\u0647 ${formatFaNum(rank)} \u06A9\u0634\u0648\u0631</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
            <span style="color:var(--text-sub)">\u0641\u0631\u0648\u0634 \u062E\u0627\u0644\u0635:</span>
            <strong class="tabular-nums" style="color:var(--c-primary)">${formatFaNum(sales, 1)} \u0645\u06CC\u0644\u06CC\u0627\u0631\u062F \u062A</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
            <span style="color:var(--text-sub)">\u062A\u0639\u062F\u0627\u062F \u0633\u0641\u0627\u0631\u0634:</span>
            <strong class="tabular-nums">${formatFaNum(orders)}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
            <span style="color:var(--text-sub)">\u0645\u0634\u062A\u0631\u06CC\u0627\u0646 \u0641\u0639\u0627\u0644:</span>
            <strong class="tabular-nums">${formatFaNum(customers)} \u0646\u0641\u0631</strong>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span style="color:var(--text-sub)">\u0631\u0634\u062F (${formatFaNum(branches)} \u0634\u0639\u0628\u0647):</span>
            <strong class="tabular-nums" style="color:var(--status-up-text)">+${formatFaNum(growth, 1)}\u066A</strong>
          </div>
        `, e.clientX, e.clientY);
        });
        path.addEventListener("mouseleave", hideTooltip);
        path.addEventListener("click", () => {
          const pid = path.getAttribute("data-province-id") || "IR-23";
          state.selectedProvinceId = pid;
          if (state.activePage === "overview") {
            state.activePage = "map";
          }
          hideTooltip();
          render();
        });
      });
      rootEl.querySelectorAll("[data-map-metric]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.mapMetric = btn.getAttribute("data-map-metric");
          render();
        });
      });
      rootEl.querySelectorAll("[data-map-zoom]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const z = btn.getAttribute("data-map-zoom");
          if (z === "in") state.mapZoom = Math.min(1.6, +(state.mapZoom + 0.18).toFixed(2));
          else if (z === "out") state.mapZoom = Math.max(0.85, +(state.mapZoom - 0.18).toFixed(2));
          else state.mapZoom = 1;
          render();
        });
      });
      const provSearch = rootEl.querySelector("[data-province-search]");
      if (provSearch) {
        provSearch.addEventListener("input", () => {
          const val = provSearch.value;
          state.provinceSearch = val;
          render();
          const next = rootEl.querySelector("[data-province-search]");
          if (next) {
            next.focus();
            next.setSelectionRange(val.length, val.length);
          }
        });
      }
      rootEl.querySelectorAll("[data-prov-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          state.provinceSortBy = th.getAttribute("data-prov-sort");
          render();
        });
      });
      rootEl.querySelectorAll("[data-select-province]").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.selectedProvinceId = tr.getAttribute("data-select-province") || "IR-23";
          render();
        });
      });
      rootEl.querySelectorAll("[data-select-segment]").forEach((el) => {
        el.addEventListener("click", () => {
          const seg = el.getAttribute("data-select-segment") || "all";
          state.selectedSegmentId = state.selectedSegmentId === seg && seg !== "all" ? "all" : seg;
          state.customerPage = 1;
          render();
        });
      });
      const custSegSelect = rootEl.querySelector("[data-customer-segment-select]");
      if (custSegSelect) {
        custSegSelect.addEventListener("change", () => {
          state.selectedSegmentId = custSegSelect.value;
          state.customerPage = 1;
          render();
        });
      }
      const custSearch = rootEl.querySelector("[data-customer-search]");
      if (custSearch) {
        custSearch.addEventListener("input", () => {
          const val = custSearch.value;
          state.customerSearch = val;
          state.customerPage = 1;
          render();
          const next = rootEl.querySelector("[data-customer-search]");
          if (next) {
            next.focus();
            next.setSelectionRange(val.length, val.length);
          }
        });
      }
      rootEl.querySelectorAll("[data-cust-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const col = th.getAttribute("data-cust-sort");
          if (state.customerSortBy === col) {
            state.customerSortDir = state.customerSortDir === "desc" ? "asc" : "desc";
          } else {
            state.customerSortBy = col;
            state.customerSortDir = "desc";
          }
          render();
        });
      });
      rootEl.querySelectorAll("[data-cust-page]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const p = parseInt(btn.getAttribute("data-cust-page") || "1", 10);
          if (!isNaN(p) && p >= 1) {
            state.customerPage = p;
            render();
          }
        });
      });
      rootEl.querySelectorAll("[data-prod-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.productCategory = btn.getAttribute("data-prod-cat") || "all";
          render();
        });
      });
      const prodSearch = rootEl.querySelector("[data-product-search]");
      if (prodSearch) {
        prodSearch.addEventListener("input", () => {
          const val = prodSearch.value;
          state.productSearch = val;
          render();
          const next = rootEl.querySelector("[data-product-search]");
          if (next) {
            next.focus();
            next.setSelectionRange(val.length, val.length);
          }
        });
      }
      rootEl.querySelectorAll("[data-prod-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          state.productSortBy = th.getAttribute("data-prod-sort");
          render();
        });
      });
      rootEl.querySelectorAll("[data-select-product]").forEach((el) => {
        el.addEventListener("click", () => {
          state.selectedProductId = el.getAttribute("data-select-product");
          render();
        });
      });
      rootEl.querySelectorAll(".scatter-point").forEach((pt) => {
        pt.addEventListener("mousemove", (e) => {
          const name = pt.getAttribute("data-name") || "";
          const price = parseFloat(pt.getAttribute("data-price") || "0");
          const vol = parseFloat(pt.getAttribute("data-vol") || "0");
          const rev = parseFloat(pt.getAttribute("data-rev") || "0");
          const margin = parseFloat(pt.getAttribute("data-margin") || "0");
          showTooltip(`
          <div style="font-weight:700;color:var(--c-heading);margin-bottom:4px;border-bottom:1px solid var(--border-color);padding-bottom:4px;">${name}</div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2px;"><span>\u0642\u06CC\u0645\u062A \u0648\u0627\u062D\u062F:</span><strong class="tabular-nums">${formatFaNum(price)} \u0647\u0632\u0627\u0631 \u062A</strong></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2px;"><span>\u062D\u062C\u0645 \u0641\u0631\u0648\u0634:</span><strong class="tabular-nums">${formatFaNum(vol, 1)} \u0647\u0632\u0627\u0631 \u0639\u062F\u062F</strong></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:2px;"><span>\u062F\u0631\u0622\u0645\u062F \u06A9\u0644:</span><strong class="tabular-nums" style="color:var(--c-primary)">${formatFaNum(rev, 1)} \u0645\u06CC\u0644\u06CC\u0627\u0631\u062F \u062A</strong></div>
          <div style="display:flex;justify-content:space-between;"><span>\u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F:</span><strong class="tabular-nums" style="color:var(--status-up-text)">${formatFaNum(margin, 1)}\u066A</strong></div>
        `, e.clientX, e.clientY);
        });
        pt.addEventListener("mouseleave", hideTooltip);
        pt.addEventListener("click", () => {
          state.selectedProductId = pt.getAttribute("data-product-id");
          hideTooltip();
          render();
        });
      });
      rootEl.querySelectorAll("[data-branch-format]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.branchFormat = btn.getAttribute("data-branch-format") || "all";
          render();
        });
      });
      rootEl.querySelectorAll("[data-branch-metric]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.branchChartMetric = btn.getAttribute("data-branch-metric");
          render();
        });
      });
      const branchSearch = rootEl.querySelector("[data-branch-search]");
      if (branchSearch) {
        branchSearch.addEventListener("input", () => {
          const val = branchSearch.value;
          state.branchSearch = val;
          render();
          const next = rootEl.querySelector("[data-branch-search]");
          if (next) {
            next.focus();
            next.setSelectionRange(val.length, val.length);
          }
        });
      }
      rootEl.querySelectorAll("[data-toggle-branch-compare]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const bid = btn.getAttribute("data-toggle-branch-compare") || "";
          if (state.comparedBranchIds.includes(bid)) {
            if (state.comparedBranchIds.length > 1) {
              state.comparedBranchIds = state.comparedBranchIds.filter((id) => id !== bid);
            }
          } else {
            if (state.comparedBranchIds.length >= 3) {
              state.comparedBranchIds = [...state.comparedBranchIds.slice(1), bid];
            } else {
              state.comparedBranchIds = [...state.comparedBranchIds, bid];
            }
          }
          render();
        });
      });
    }
    window.addEventListener("keydown", (e) => {
      const tag = e.target?.tagName;
      const isTyping = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        state.cmdModalOpen = !state.cmdModalOpen;
        render();
        const input = rootEl.querySelector("#taraz-cmd-input");
        if (input) input.focus();
        return;
      }
      if (e.key === "Escape") {
        if (state.cmdModalOpen || state.consultModalOpen || state.exportModalOpen || state.notifOpen) {
          state.cmdModalOpen = false;
          state.consultModalOpen = false;
          state.exportModalOpen = false;
          state.notifOpen = false;
          render();
        }
        return;
      }
      if (!isTyping && !e.metaKey && !e.ctrlKey && !e.altKey) {
        if (e.key === "1") {
          state.activePage = "overview";
          render();
          animateNumbers();
        } else if (e.key === "2") {
          state.activePage = "map";
          render();
        } else if (e.key === "3") {
          state.activePage = "customers";
          render();
        } else if (e.key === "4") {
          state.activePage = "products";
          render();
        } else if (e.key === "5") {
          state.activePage = "branches";
          render();
        } else if (e.key.toLowerCase() === "t") {
          state.theme = state.theme === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", state.theme);
          render();
        }
      }
    });
    document.addEventListener("click", (e) => {
      const target = e.target;
      if (state.notifOpen && !target.closest("[data-toggle-notif]")) {
        state.notifOpen = false;
        render();
      }
    });
    render();
    animateNumbers();
  }

  // standalone-entry.ts
  var boot = () => {
    const root = document.getElementById("binesh-standalone-root");
    if (root) initBineshDashboard(root);
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

  </script>
</body>
</html>
